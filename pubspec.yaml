name: queerverse
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  provider: ^6.1.2

  # Firebase
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1
  cloud_firestore: ^6.4.1
  firebase_storage: ^13.4.3

  # Images
  image_picker: ^1.1.2
  cached_network_image: ^3.4.1

  # HTTP & Sharing
  http: ^1.6.0
  share_plus: ^10.1.3

  # Date & Time
  intl: ^0.19.0

  # UI Packages
  google_fonts: ^6.3.1
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0
  flutter_svg: ^2.2.0
  lottie: ^3.1.2
  url_launcher: ^6.3.2
  audioplayers: ^6.8.1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/events/
    - assets/lottie/